<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INYECTOR AMSTARSH</title>
    <style>
        :root { --gold: #d4af37; --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --border: #333; }
        .light-mode { --bg: #f5f5f5; --card: #ffffff; --text: #1a1a1a; --border: #ddd; --gold: #b8860b; }
        
        body { background: var(--bg); color: var(--text); font-family: sans-serif; transition: 0.3s; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; position: relative; }
        
        .theme-toggle { position: absolute; top: 0; right: 0; cursor: pointer; background: var(--card); border: 1px solid var(--gold); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        
        .admin-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-top: 20px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); box-sizing: border-box; }
        .btn { background: var(--gold); color: white; border: none; padding: 15px; width: 100%; margin-top: 20px; cursor: pointer; font-weight: bold; }
        .output { background: #000; color: #0f0; padding: 15px; margin-top: 20px; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="theme-toggle" onclick="toggleTheme()">🌓</div>
        <h1 style="text-align:center; color:var(--gold);">INYECTOR V1.2</h1>
        <a href="index.html" style="display:block; text-align:center; color:#888; text-decoration:none; font-size:10px;">[ VOLVER A LA INTERFACE ]</a>

        <div class="admin-card">
            <input type="text" id="c-titulo" placeholder="Nombre del Amstarsh">
            <textarea id="c-lore" rows="4" placeholder="Historia..."></textarea>
            <button class="btn" onclick="generar()">GENERAR CÓDIGO</button>
        </div>
        <div id="output" class="output">El código aparecerá aquí...</div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

        function generar() {
            const t = document.getElementById('c-titulo').value;
            const l = document.getElementById('c-lore').value;
            const id = t.toLowerCase();
            document.getElementById('output').innerText = `"${id}": { titulo: "${t}", lore: "${l}" },`;
        }
    </script>
</body>
</html>
