<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Lirié v1.2</title>
    <style>
        :root { --gold: #d4af37; --bg: #0f0f0f; --card: #1a1a1a; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; }
        h1 { color: var(--gold); text-align: center; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid var(--gold); padding-bottom: 10px; }
        .search-box { width: 100%; padding: 15px; background: var(--card); border: 1px solid #444; color: white; border-radius: 8px; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .search-box:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .result-card { background: var(--card); padding: 20px; border-radius: 8px; border-left: 4px solid var(--gold); min-height: 120px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .label { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .word { font-size: 28px; font-weight: bold; color: var(--gold); margin: 0; letter-spacing: 1px; line-height: 1.2; }
        .meaning { font-style: italic; color: #aaa; margin-top: 10px; font-size: 14px; }
        .footer { margin-top: 40px; font-size: 10px; color: #555; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>Lirié App</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Escribe una oración (ej: Dios luz fuego)..." oninput="buscar()">
    
    <div id="result" class="result-card">
        <p class="label" id="statusLabel">Traducción de Ley</p>
        <div id="lirieWord" class="word">---</div>
        <p id="spanishMeaning" class="meaning">Escribe para empezar</p>
    </div>

    <div class="footer">
        SISTEMA AMSTARSH | TRADUCTOR DE ORACIONES<br>
        PROYECTO MA-LUMIN | SIN PUBLICIDAD
    </div>
</div>

        // --- EXPANSIÓN MASIVA: EMOCIONES Y COMBATE ---
        {es: "amor", li: "AHAV", mod: "Sentimientos"},
        {es: "paz", li: "SHALOM", mod: "Sentimientos"},
        {es: "odio", li: "SANA", mod: "Sentimientos"},
        {es: "miedo", li: "YARE", mod: "Sentimientos"},

        // --- EXPANSIÓN MASIVA: FAMILIA Y MUNDO ---
        {es: "hijo", li: "BEN", mod: "Familia"},

        {es: "madre", li: "EM", mod: "Familia"},

        {es: "cielo", li: "SAM", mod: "Mundo"},
        {es: "tierra", li: "ADAM", mod: "Mundo"},
        {es: "ahora", li: "ATA", mod: "Tiempo"},
        {es: "siempre", li: "OLAM", mod: "Tiempo"},
        {es: "gracias", li: "TODA", mod: "Social"}
    ];

    function buscar() {
        const query = document.getElementById('searchInput').value.trim();
        const displayLi = document.getElementById('lirieWord');
        const displayEs = document.getElementById('spanishMeaning');
        const statusLabel = document.getElementById('statusLabel');
        
        if (query === "") {
            statusLabel.innerText = "Traducción de Ley";
            displayLi.innerText = "---";
            displayEs.innerText = "Escribe para empezar";
            return;
        }

        // Función interna para limpiar tildes y mayúsculas
        const limpiar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        // DIVIDIR LA FRASE EN PALABRAS
        const palabrasInput = query.split(/\s+/);
        let resultadoLirie = [];
        let modulosUsados = new Set();

        palabrasInput.forEach(palabra => {
            // BUSCADOR INTELIGENTE: Compara la palabra limpia con el diccionario limpio
            const encontrado = diccionario.find(item => limpiar(item.es) === limpiar(palabra));
            
            if (encontrado) {
                resultadoLirie.push(encontrado.li);
                modulosUsados.add(encontrado.mod);
            } else {
                resultadoLirie.push(`(${palabra})`);
            }
        });

        // ACTUALIZAR PANTALLA
        statusLabel.innerText = "Oración Lirié";
        displayLi.innerText = resultadoLirie.join(" ");
        
        const mods = Array.from(modulosUsados);
        displayEs.innerText = mods.length > 0 
            ? "Módulos activos: " + mods.join(", ") 
            : "Palabra no encontrada en los módulos";
    }
</script>

</body>
</html>
