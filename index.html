<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Lirié v1.3</title>
    <style>
        :root { --gold: #d4af37; --bg: #0f0f0f; --card: #1a1a1a; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; }
        h1 { color: var(--gold); text-align: center; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid var(--gold); padding-bottom: 10px; }
        .search-box { width: 100%; padding: 15px; background: var(--card); border: 1px solid #444; color: white; border-radius: 8px; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .search-box:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .result-card { background: var(--card); padding: 20px; border-radius: 8px; border-left: 4px solid var(--gold); min-height: 120px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; }
        .label { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .word { font-size: 28px; font-weight: bold; color: var(--gold); margin: 0; letter-spacing: 1px; line-height: 1.2; padding-right: 40px; }
        .meaning { font-style: italic; color: #aaa; margin-top: 10px; font-size: 14px; }
        .copy-btn { margin-top: 15px; padding: 10px; background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 5px; cursor: pointer; font-size: 12px; text-transform: uppercase; transition: 0.3s; width: fit-content; }
        .copy-btn:hover { background: var(--gold); color: black; }
        .footer { margin-top: 40px; font-size: 10px; color: #555; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>Lirié App</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Escribe una oración..." oninput="buscar()">
    
    <div id="result" class="result-card">
        <p class="label" id="statusLabel">Traducción de Ley</p>
        <div id="lirieWord" class="word">---</div>
        <p id="spanishMeaning" class="meaning">Escribe para empezar</p>
        <button class="copy-btn" id="copyBtn" onclick="copiarTraduccion()">Copiar Lirié</button>
    </div>

    <div class="footer">
        SISTEMA AMSTARSH | TRADUCTOR DE ORACIONES<br>
        PROYECTO MA-LUMIN | SIN PUBLICIDAD
    </div>
</div>

<script>
    const diccionario = [
        {es: "dios", li: "ELOH", mod: "Sagrado"},
        {es: "palabra", li: "LOG", mod: "Sagrado"},
        {es: "luz", li: "AUR", mod: "Sagrado"},
        {es: "pacto", li: "BER", mod: "Sagrado"},
        {es: "verdad", li: "EMET", mod: "Sagrado"},
        {es: "fuego", li: "ESH", mod: "Elementos"},
        {es: "agua", li: "MAY", mod: "Elementos"},
        {es: "hielo", li: "KERET", mod: "Elementos"},
        {es: "viento", li: "RUAH", mod: "Elementos"},
        {es: "oscuridad", li: "NOX", mod: "Elementos"},
        {es: "protector", li: "AMSTARSH", mod: "Jerarquía"},
        {es: "maestro", li: "BVAR", mod: "Jerarquía"},
        {es: "rey", li: "MALK", mod: "Civilización"},
        {es: "espada", li: "JEREV", mod: "Civilización"},
        {es: "bvoriam", li: "MENTOR-PRIMO", mod: "Personajes"},
        {es: "max maximilian", li: "MAX-DARK", mod: "Protecters"},
        {es: "hola", li: "SHAL", mod: "Social"},
        {es: "como", li: "KE", mod: "Dudas"},
        {es: "estas", li: "AYEK", mod: "Estados"},
        {es: "esta", li: "AYE", mod: "Estados"},
        {es: "estoy", li: "HAYA", mod: "Estados"},
        {es: "bien", li: "TOV", mod: "Estados"},
        {es: "mal", li: "RA", mod: "Estados"},
        {es: "es", li: "VET", mod: "Gramática"},
        {es: "un", li: "DA", mod: "Gramática"},
        {es: "el", li: "HA", mod: "Gramática"},
        {es: "la", li: "HA", mod: "Gramática"},
        {es: "y", li: "VE", mod: "Gramática"},
        {es: "mi", li: "ANI", mod: "Gramática"},
        {es: "tu", li: "ATA", mod: "Persona"},
        {es: "yo", li: "ANOKI", mod: "Persona"},
        {es: "soy", li: "VET-ANI", mod: "Persona"},
        {es: "ir", li: "LEK", mod: "Acciones"},
        {es: "venir", li: "BO", mod: "Acciones"},
        {es: "ver", li: "RA", mod: "Acciones"},
        {es: "amor", li: "AHAV", mod: "Sentimientos"},
        {es: "paz", li: "SHALOM", mod: "Sentimientos"},
        {es: "fuerte", li: "AZ", mod: "Cualidades"},
        {es: "hijo", li: "BEN", mod: "Familia"},
        {es: "siempre", li: "OLAM", mod: "Tiempo"},
        {es: "gracias", li: "TODA", mod: "Social"}
    ];

    function buscar() {
        const query = document.getElementById('searchInput').value.trim();
        const displayLi = document.getElementById('lirieWord');
        const displayEs = document.getElementById('spanishMeaning');
        const statusLabel = document.getElementById('statusLabel');
        
        if (query === "") {
            statusLabel.innerText = "Traducción de Ley";
            displayLi.innerText = "---";
            displayEs.innerText = "Escribe para empezar";
            return;
        }

        const limpiar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const palabrasInput = query.split(/\s+/);
        let resultadoLirie = [];
        let modulosUsados = new Set();

        palabrasInput.forEach(palabra => {
            const encontrado = diccionario.find(item => limpiar(item.es) === limpiar(palabra));
            if (encontrado) {
                resultadoLirie.push(encontrado.li);
                modulosUsados.add(encontrado.mod);
            } else {
                resultadoLirie.push(`(${palabra})`);
            }
        });

        statusLabel.innerText = "Oración Lirié";
        displayLi.innerText = resultadoLirie.join(" ");
        const mods = Array.from(modulosUsados);
        displayEs.innerText = mods.length > 0 ? "Módulos: " + mods.join(", ") : "Sin módulos";
    }

    function copiarTraduccion() {
        const texto = document.getElementById('lirieWord').innerText;
        if (texto === "---") return;
        
        navigator.clipboard.writeText(texto).then(() => {
            const btn = document.getElementById('copyBtn');
            const originalText = btn.innerText;
            btn.innerText = "¡Copiado!";
            btn.style.background = "var(--gold)";
            btn.style.color = "black";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "transparent";
                btn.style.color = "var(--gold)";
            }, 1000);
        });
    }
</script>

</body>
</html>
