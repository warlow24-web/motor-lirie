<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MA-LUMIN - CÓDICE JERÁRQUICO</title>
    <style>
        /* VARIABLES DINÁMICAS */
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --gold: #d4af37;
            --glow: rgba(255, 255, 255, 0.4);
            --border: #333;
        }

        /* CLASE PARA MODO CLARO (VICEVERSA) */
        .light-mode {
            --bg: #f5f5f5;
            --card: #ffffff;
            --text: #222222;
            --gold: #b8860b; /* Un dorado más profundo para fondo claro */
            --glow: rgba(0, 0, 0, 0.2); /* Sombra oscura para que resalte en blanco */
            --border: #ddd;
        }

        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; transition: 0.3s;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        /* BOTÓN DE CAMBIO DE MODO */
        .theme-toggle {
            align-self: flex-end; padding: 10px 20px; border-radius: 20px;
            border: 1px solid var(--gold); background: var(--card);
            color: var(--gold); cursor: pointer; font-weight: bold;
            text-shadow: 0 0 5px var(--glow); margin-bottom: 20px;
        }

        .container { width: 100%; max-width: 800px; }
        
        h1 { 
            color: var(--gold); text-shadow: 0 0 10px var(--glow);
            text-align: center; letter-spacing: 5px; text-transform: uppercase;
        }

        /* ESTRUCTURA DE DESPLEGABLES */
        .desplegable { margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--card); }

        .header-oro {
            width: 100%; padding: 18px; background: rgba(0,0,0,0.05);
            color: var(--gold); text-shadow: 0 0 8px var(--glow);
            border: none; cursor: pointer; font-weight: bold;
            text-transform: uppercase; text-align: left; font-size: 14px;
        }

        .contenido-oculto { display: none; padding: 20px; border-top: 1px solid var(--border); }
        .show { display: block !important; }

        .ficha { 
            border-left: 3px solid var(--gold); padding-left: 15px; margin-bottom: 15px; 
            background: rgba(128,128,128,0.05); padding: 10px; border-radius: 0 5px 5px 0;
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">CAMBIAR MODO (DÍA/NOCHE)</button>

    <div class="container">
        <h1>Lirié: Códice de Jerarquías</h1>

        <!-- 1. LOS 16 AMSTARSH -->
        <div class="desplegable">
            <button class="header-oro" onclick="toggleSec('sec-16')">▼ PRIMERA JERARQUÍA: LOS 16 AMSTARSH</button>
            <div id="sec-16" class="contenido-oculto">
                <div class="ficha">
                    <strong>Alistar del Hielo:</strong> Maestro Amstarsh del continente Glacia.
                </div>
                <!-- Aquí inyectas los demás de los 16 -->
            </div>
        </div>

        <!-- 2. LOS 100 GUERREROS -->
        <div class="desplegable">
            <button class="header-oro" onclick="toggleSec('sec-100')">▼ SEGUNDA JERARQUÍA: LOS 100 GUERREROS</button>
            <div id="sec-100" class="contenido-oculto">
                <p>Lista de combatientes Liriansh subordinados...</p>
            </div>
        </div>

        <!-- 3. BVORIAN Y OTROS -->
        <div class="desplegable">
            <button class="header-oro" onclick="toggleSec('sec-otros')">▼ REGISTROS EXTERNOS: BVORIAN Y VARIANTES</button>
            <div id="sec-otros" class="contenido-oculto">
                <div class="ficha">
                    <strong>Bvorian:</strong> Entidad de registro externo.
                </div>
            </div>
        </div>
    </div>

<script>
    // Función para mostrar/ocultar secciones
    function toggleSec(id) {
        document.getElementById(id).classList.toggle('show');
    }

    // Función para cambiar el modo
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
    }
</script>

</body>
</html>
